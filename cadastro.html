
<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ProntVita - Cadastro</title>

    <link rel="stylesheet" href="estilo.css">
</head>

<body>

    <!-- CABEÇALHO -->
    <header class="cabecalho">

        <!-- MENU DOS TRÊS PONTOS -->
        <div class="menu-container">

            <button class="menu-botao" onclick="abrirMenu()">
                <span></span>
                <span></span>
                <span></span>
            </button>

            <!-- MENU -->
            <div class="menu-dropdown" id="menuDropdown">

                <a href="index.html">Login</a>

                <a href="cadastro.html">Cadastro</a>

            </div>

        </div>


        <!-- LOGO -->
        <div class="logo">
            <span>Pront</span><span>Vita</span>
        </div>

    </header>


    <!-- ÁREA PRINCIPAL -->
    <main class="principal">

        <!-- CARD DE CADASTRO -->
        <section class="cadastro-card">

            <!-- ÍCONE -->
            <div class="icone">

                <svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">

                    <rect x="15" y="10"
                          width="34"
                          height="45"
                          rx="3"
                          fill="none"
                          stroke="#08a9c7"
                          stroke-width="3"/>

                    <rect x="25" y="5"
                          width="14"
                          height="9"
                          rx="2"
                          fill="white"
                          stroke="#08a9c7"
                          stroke-width="3"/>

                    <line x1="32" y1="23"
                          x2="32" y2="35"
                          stroke="#08a9c7"
                          stroke-width="3"/>

                    <line x1="26" y1="29"
                          x2="38" y2="29"
                          stroke="#08a9c7"
                          stroke-width="3"/>

                </svg>

            </div>


            <!-- TÍTULO -->
            <h1>Prontuário Eletrônico</h1>

            <p class="subtitulo">
                Realizar Cadastro
            </p>


            <!-- FORMULÁRIO -->
            <form class="form-cadastro">

                <!-- NOME -->
                <div class="campo campo-completo">

                    <label for="nome">
                        Nome Completo
                    </label>

                    <input
                        type="text"
                        id="nome"
                        placeholder="Nome Completo"
                    >

                </div>


                <!-- CPF -->
                <div class="campo">

                    <label for="cpf">
                        CPF
                    </label>

                    <input
                        type="text"
                        id="cpf"
                        placeholder="xxx.xxx.xxx-xx"
                    >

                </div>


                <!-- DATA DE NASCIMENTO -->
                <div class="campo">

                    <label for="data">
                        Data de Nascimento
                    </label>

                    <input
                        type="text"
                        id="data"
                        placeholder="DD/MM/AAAA"
                    >

                </div>


                <!-- TELEFONE -->
                <div class="campo">

                    <label for="telefone">
                        Telefone
                    </label>

                    <input
                        type="text"
                        id="telefone"
                        placeholder="(__) _____-____"
                    >

                </div>


                <!-- EMAIL -->
                <div class="campo">

                    <label for="email">
                        e-mail
                    </label>

                    <input
                        type="email"
                        id="email"
                        placeholder="exemplo@email.com"
                    >

                </div>


                <!-- PAPEL -->
                <div class="campo campo-completo">

                    <label for="papel">
                        Qual papel você exerce na sua Instituição?
                    </label>

                    <select id="papel">

                        <option value="">
                            Selecione
                        </option>

                        <option value="medico">
                            Médico
                        </option>

                        <option value="enfermeiro">
                            Enfermeiro
                        </option>

                        <option value="tecnico">
                            Técnico de Enfermagem
                        </option>

                        <option value="administrativo">
                            Administrativo
                        </option>

                        <option value="outro">
                            Outro
                        </option>

                    </select>

                </div>


                <!-- SENHA -->
                <div class="campo">

                    <label for="senha">
                        Senha
                    </label>

                    <input
                        type="password"
                        id="senha"
                        placeholder="--------------"
                    >

                </div>


                <!-- CONFIRMAR SENHA -->
                <div class="campo">

                    <label for="confirmarSenha">
                        Confirmar Senha
                    </label>

                    <input
                        type="password"
                        id="confirmarSenha"
                        placeholder="--------------"
                    >

                </div>


                <!-- BOTÃO -->
                <div class="botao-cadastro">

                    <button type="submit">
                        Cadastrar
                    </button>

                </div>

            </form>


            <!-- VOLTAR PARA LOGIN -->
            <p class="criar-conta">

                Já tem uma conta?

                <a href="index.html">
                    Entrar
                </a>

            </p>

        </section>

    </main>


    <!-- JAVASCRIPT DO MENU -->
    <script>

        function abrirMenu() {

            const menu = document.getElementById("menuDropdown");

            menu.classList.toggle("ativo");

        }

    </script>

</body>
</html>
```
