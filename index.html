
<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ProntVita - Login</title>

    <link rel="stylesheet" href="estilo.css">
</head>

<body>

    <!-- CABEÇALHO -->
    <header class="cabecalho">

        <!-- MENU DOS TRÊS PONTOS -->
        <div class="menu-container">

            <button class="menu-botao" onclick="abrirMenu()">
                <span></span>
                <span></span>
                <span></span>
            </button>

            <!-- MENU -->
            <div class="menu-dropdown" id="menuDropdown">

                <a href="index.html">Login</a>

                <a href="cadastro.html">Cadastro</a>

            </div>

        </div>


        <!-- LOGO -->
        <div class="logo">
            <span>Pront</span><span>Vita</span>
        </div>

    </header>


    <!-- ÁREA PRINCIPAL -->
    <main class="principal">

        <!-- CARD DE LOGIN -->
        <section class="login-card">

            <!-- ÍCONE -->
            <div class="icone">

                <svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">

                    <rect x="15" y="10"
                          width="34"
                          height="45"
                          rx="3"
                          fill="none"
                          stroke="#08a9c7"
                          stroke-width="3"/>

                    <rect x="25" y="5"
                          width="14"
                          height="9"
                          rx="2"
                          fill="white"
                          stroke="#08a9c7"
                          stroke-width="3"/>

                    <line x1="32" y1="23"
                          x2="32" y2="35"
                          stroke="#08a9c7"
                          stroke-width="3"/>

                    <line x1="26" y1="29"
                          x2="38" y2="29"
                          stroke="#08a9c7"
                          stroke-width="3"/>

                    <path d="M37 43
                             C37 38, 44 38, 44 43
                             C44 38, 51 38, 51 43
                             C51 49, 44 53, 44 53
                             C44 53, 37 49, 37 43Z"
                          fill="none"
                          stroke="#08a9c7"
                          stroke-width="2"/>

                </svg>

            </div>


            <!-- TÍTULO -->
            <h1>Prontuário Eletrônico</h1>

            <p class="subtitulo">
                Acesso para profissionais de saúde
            </p>


            <!-- FORMULÁRIO -->
            <form>

                <label for="usuario">
                    Nome Completo ou e-mail Institucional
                </label>

                <input
                    type="text"
                    id="usuario"
                    placeholder="Nome Completo ou e-mail Institucional"
                >


                <label for="senha">
                    Senha
                </label>

                <input
                    type="password"
                    id="senha"
                    placeholder="Digite sua senha"
                >


                <a href="#" class="esqueci">
                    Esqueceu sua senha?
                </a>


                <button type="submit">
                    Entrar
                </button>

            </form>


            <!-- CADASTRO -->
            <p class="criar-conta">
                Não tem uma conta?
                <a href="cadastro.html">Criar</a>
            </p>

        </section>

    </main>


    <!-- JAVASCRIPT DO MENU -->
    <script>

        function abrirMenu() {

            const menu = document.getElementById("menuDropdown");

            menu.classList.toggle("ativo");

        }

    </script>

</body>
</html>
